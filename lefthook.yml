# Монорепо: конфиг на уровне репо. Команды выполняются в подпапках apps/*
# через `bun --cwd`. Глобы отсекают коммиты вне apps/** (docs, infra, pocketbase).
pre-commit:
  parallel: true
  commands:
    typecheck:
      glob: "apps/site/**/*.{ts,tsx}"
      run: bun --cwd apps/site run typecheck
    lint-ts:
      glob: "apps/site/**/*.{ts,tsx,js,mjs}"
      run: bun --cwd apps/site run lint
    lint-scss:
      glob: "apps/site/**/*.{scss,css}"
      run: bun --cwd apps/site run lint:css
    format-check:
      glob: "apps/site/**/*.{ts,tsx,js,mjs,json,scss,css}"
      run: bun --cwd apps/site run format:check
    typecheck-admin:
      glob: "apps/admin/**/*.{ts,tsx}"
      run: bun --cwd apps/admin run typecheck

pre-push:
  parallel: false
  commands:
    typecheck:
      run: bun --cwd apps/site run typecheck
    build:
      run: bun --cwd apps/site run build
