# Монорепо (ADR-014): конфиг на уровне репо (рядом с .git), а команды выполняются
# внутри web/. Глобы матчат web/** — коммиты вне web (docs/infra) хуки пропускают.
# Когда появится admin/ — добавить сюда его typecheck/lint аналогично.
pre-commit:
  parallel: true
  commands:
    typecheck:
      glob: "web/**/*.{ts,tsx}"
      run: cd web && /Users/vladimirmazyrec/.bun/bin/bun run typecheck
    lint-ts:
      glob: "web/**/*.{ts,tsx,js,mjs}"
      run: cd web && /Users/vladimirmazyrec/.bun/bin/bun run lint
    lint-scss:
      glob: "web/**/*.{scss,css}"
      run: cd web && /Users/vladimirmazyrec/.bun/bin/bun run lint:css
    format-check:
      glob: "web/**/*.{ts,tsx,js,mjs,json,scss,css}"
      run: cd web && /Users/vladimirmazyrec/.bun/bin/bun run format:check

pre-push:
  parallel: false
  commands:
    typecheck:
      run: cd web && /Users/vladimirmazyrec/.bun/bin/bun run typecheck
    build:
      run: cd web && /Users/vladimirmazyrec/.bun/bin/bun run build
