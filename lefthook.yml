# Монорепо: конфиг на уровне репо. Root-скрипты (bun run typecheck:site и т.п.)
# делегируют в apps/*. Глобы отсекают коммиты вне apps/** (docs, infra, pocketbase).
pre-commit:
  parallel: true
  commands:
    typecheck:
      glob: "apps/site/**/*.{ts,tsx}"
      run: bun run typecheck:site
    lint-ts:
      glob: "apps/site/**/*.{ts,tsx,js,mjs}"
      run: bun run lint
    lint-scss:
      glob: "apps/site/**/*.{scss,css}"
      run: bun run lint:css
    format-check:
      glob: "apps/site/**/*.{ts,tsx,js,mjs,json,scss,css}"
      run: bun run format:check
    typecheck-admin:
      glob: "apps/admin/**/*.{ts,tsx}"
      run: bun run typecheck:admin

pre-push:
  parallel: false
  commands:
    typecheck:
      run: bun run typecheck:site
    build:
      run: bun run build:site
