# Контейнерный nginx для admin-SPA. Host-nginx (admin.more-minsk.by) отдаёт сюда
# только `/` (а /api/, /_/ проксирует в PocketBase). SPA-fallback на index.html.
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Хэшированные ассеты Vite — immutable.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA — все маршруты на index.html (react-router).
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }

  gzip on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
