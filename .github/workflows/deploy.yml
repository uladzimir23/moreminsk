name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

# Один активный деплой; новый push ждёт текущего, не отменяет.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/moreminsk
  IMAGE_PB: ghcr.io/${{ github.repository_owner }}/moreminsk-pb

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v6

      - id: meta
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # GHCR login via встроенный GITHUB_TOKEN — image привязывается к репо.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Сайт (static export) — build-контекст = корень, Dockerfile корневой.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Два тега: latest для compose pull, sha для rollback.
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.meta.outputs.sha }}
          # gha cache — ускоряет повторные сборки в ~3 раза за счёт layer-reuse.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # PocketBase (ADR-012) — build-контекст = pocketbase/, мигра­ции в образе.
      - uses: docker/build-push-action@v6
        with:
          context: ./pocketbase
          push: true
          tags: |
            ${{ env.IMAGE_PB }}:latest
            ${{ env.IMAGE_PB }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=pb
          cache-to: type=gha,mode=max,scope=pb

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: SSH + compose pull/up
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: 89.169.54.11
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER
          # GHCR auth по эфемерному GITHUB_TOKEN — на сервере credentials
          # не хранятся, логин/логаут оборачивает pull.
          script: |
            set -e
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            cd /opt/moreminsk
            docker compose pull
            docker compose up -d --remove-orphans
            docker logout ghcr.io
            docker image prune -f
