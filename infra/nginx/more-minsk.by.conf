# Host-side reverse proxy: new.moreminsk.by → docker container 127.0.0.1:3004.
# Copy to /etc/nginx/sites-enabled/new.moreminsk.by.conf на сервере.
#
# После первого deploy запустить:
#   certbot --nginx -d new.moreminsk.by
# certbot перепишет этот файл — добавит 443 server + redirect 80 → 443.

server {
  listen 80;
  listen [::]:80;
  server_name new.moreminsk.by;

  # ACME challenge для certbot — обычно автоматически, но защищаем явно.
  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    proxy_pass http://127.0.0.1:3004;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_connect_timeout 5s;
  }
}
