# Host-side reverse proxy: admin.more-minsk.by → админка + PocketBase.
# Copy to /etc/nginx/sites-enabled/admin.more-minsk.by.conf на сервере 89.169.54.11.
#
#   /api/  /_/   → 127.0.0.1:8094  (moreminsk-pb — REST API + Admin UI)
#   /            → 127.0.0.1:3005  (moreminsk-admin — Vite SPA, фаза 8.3)
#
# До появления admin-SPA (8.3) редактор пользуется сырым PB по /_/.
# После первого deploy:
#   certbot --nginx -d admin.more-minsk.by --redirect
# certbot перепишет файл — добавит 443 + redirect 80 → 443.

server {
  listen 80;
  listen [::]:80;
  server_name admin.more-minsk.by;

  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  # PocketBase REST API + встроенная Admin UI.
  location /api/ {
    proxy_pass http://127.0.0.1:8094;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # PB realtime (SSE) — не буферизуем.
    proxy_buffering off;
    client_max_body_size 25m; # загрузка фото в file-поля
  }

  location /_/ {
    proxy_pass http://127.0.0.1:8094;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Кастомная admin-SPA (фаза 8.3). Пока контейнера нет — вернёт 502, это ок.
  location / {
    proxy_pass http://127.0.0.1:3005;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
