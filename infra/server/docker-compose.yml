# Production compose for more-minsk.by. Lives in /opt/moreminsk/ on the
# sync-agency Hetzner box (89.169.54.11). Образы из GHCR — pushed CI'ем при
# push в main (см. .github/workflows/deploy.yml).
#
# Host nginx:
#   more-minsk.by (+www)  → 127.0.0.1:3004 → moreminsk       (сайт, static)
#   admin.more-minsk.by/  → 127.0.0.1:3010 → moreminsk-admin (SPA, фаза 8.3)
#   admin.more-minsk.by/api/ /_/ → 127.0.0.1:8095 → moreminsk-pb (PocketBase)
# vhosts: infra/nginx/more-minsk.by.conf + infra/nginx/admin.more-minsk.by.conf
#
# Порты на боксе (проверено 2026-07-29): 3001 sync-brand-site, 3002 flex-glass,
# 3003 comforthotel, 3005 clariva-landing, 3006 sync-dev-site, 3007 topup-by,
# 3008/3009 istok(+admin); 8090-8094 заняты PB других стеков (auction, prop-finder,
# flex-glass, istok, clariva). moreminsk: сайт 3004, admin 3010, PB 8095.
#
# Bootstrap PB после первого up (одноразово, значения — на сервере, не в git):
#   docker exec -it moreminsk-pb /pb/pocketbase superuser upsert <email> <pass>
#   # затем editor — из apps/site/: PB_URL=… EDITOR_EMAIL=… EDITOR_PASS=… bun run pb:roles

services:
  moreminsk:
    image: ghcr.io/uladzimir23/moreminsk:latest
    container_name: moreminsk
    restart: unless-stopped
    ports:
      - "127.0.0.1:3004:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  moreminsk-pb:
    image: ghcr.io/uladzimir23/moreminsk-pb:latest
    container_name: moreminsk-pb
    restart: unless-stopped
    ports:
      - "127.0.0.1:8095:8090" # host-nginx: admin.more-minsk.by /api/ /_/ → сюда
    volumes:
      - moreminsk_pb_data:/pb/pb_data
    environment:
      # Telegram-уведомления о новых заявках (см. pocketbase/pb_hooks/leads-telegram.pb.js).
      # Значения — в /opt/moreminsk/.env на VPS (в git не коммитим).
      TG_BOT_TOKEN: ${TG_BOT_TOKEN:-}
      TG_CHAT_IDS: ${TG_CHAT_IDS:-}
      PB_PUBLIC_URL: ${PB_PUBLIC_URL:-https://admin.more-minsk.by}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  moreminsk-admin:
    image: ghcr.io/uladzimir23/moreminsk-admin:latest
    container_name: moreminsk-admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:3010:80" # host-nginx: admin.more-minsk.by/ → сюда
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  moreminsk_pb_data:
